<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>FLYCDI – Réparation mobile, vente en gros et afficheurs LCD</title>
<style>
:root{--red:#ED1C24;--red-d:#c9141b;--ink:#26262b;--mute:#6b6b72;--line:#ececef;--chip:#efeff2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f2f3f5;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:420px}
.hero{background:#fff;border-radius:28px;padding:34px 20px 24px;text-align:center;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.hero img{width:72%;max-width:270px;height:auto;display:block;margin:0 auto}
.hero p{margin-top:18px;font-size:15px;font-weight:500;color:var(--ink)}
.label{margin:30px 6px 10px;font-size:13px;font-weight:800;letter-spacing:2px;color:var(--red);text-transform:uppercase}
.list{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:16px;padding:16px 18px;text-decoration:none;color:var(--ink);font-size:18px;font-weight:600}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:#fafafa}
.ic{width:46px;height:46px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:24px;height:24px;fill:none;stroke:#3a3a40;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.save{margin-top:22px;width:100%;border:0;background:var(--red);color:#fff;font-weight:700;font-size:18px;font-family:inherit;padding:19px;border-radius:20px;cursor:pointer;box-shadow:0 8px 18px rgba(237,28,36,.28)}
.save:active{background:var(--red-d);transform:scale(.99)}
.compat{text-align:center;margin-top:14px;font-size:15px;color:var(--mute)}
#msg{text-align:center;font-size:13px;color:var(--mute);min-height:18px;margin-top:6px}
footer{text-align:center;margin-top:26px;font-size:15px;color:var(--mute)}
footer b{color:var(--ink);font-weight:800}
</style>
</head>
